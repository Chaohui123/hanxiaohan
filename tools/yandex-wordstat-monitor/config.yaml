governanceRules:
  terminatedDirections:
    - pattern: "обогрев зеркал"
      reason: "历史已终止方向（后视镜加热垫 FAIL），禁止通过周报复活"
    - pattern: "подогрев зеркал"
      reason: "历史已终止方向（后视镜加热垫 FAIL），禁止通过周报复活"
    - pattern: "нагревательный элемент зеркала"
      reason: "历史已终止方向（后视镜加热垫 FAIL），禁止通过周报复活"
    - pattern: "термобелье женское"
      reason: "历史已终止方向（女士本季保暖内衣 FAIL），禁止复活"
  existingPortfolioExclusions:
