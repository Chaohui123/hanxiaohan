schemaVersion: "1.0.0"
algoVersion: "2026.11-obs-v1"

wordstat:
  baseUrl: "https://searchapi.api.cloud.yandex.net/v2/wordstat"
  translateUrl: "https://translate.api.cloud.yandex.net/translate/v2/translate"
  enableCloudTranslateDraft: false
  countryRegionId: 225
  referenceCities:
    - id: 213
      nameRu: "Москва"
      nameZh: "莫斯科"
    - id: 2
      nameRu: "Санкт-Петербург"
      nameZh: "圣彼得堡"
    - id: 54
      nameRu: "Екатеринбург"
      nameZh: "叶卡捷琳堡"
  devices:
    - "all"
  topNumPhrases: 50
  maxExpansionCandidatesPerReport: 20
  maxExpansionCandidatesPerSeed: 3
  weeklyLookbackWeeks: 53
  dailyStrictLookbackDays: 30
  dailyGapFillEnabled: true
  dailyGapChunkDays: 30
  watermarkBenchmarkPhrase: "вакуумные пакеты для одежды"
  strictOperatorStrategy: "separate_daily_caliber"

quotaAndRate:
  maxRequestsPerSecond: 5.0
  dailyRequestBudget: 600
  requestTimeoutSeconds: 15.0
  maxRetries429: 3
  maxRetries503: 2
  unknownOutcomeCooldownSeconds: 3.0
  maxUnknownOutcomeProbes: 0

observationThresholds:
  minWeeklyVolumeBand: 2000
  maxWeeklyVolumeBand: 80000
  minValidWeeksForScoring: 4
  freshMaxLagDays: 14
  laggingWarnMaxLagDays: 35
  staleHoldAfterLagDays: 35
  synonymClusterSimilarity: 0.72
  topObservationLimit: 10

scoring:
  weights:
    trendMomentum: 0.50
    referenceCityAffinity: 0.30
    demandStability: 0.20
  maxSingleComponentContributionRatio: 0.55
  partialComponentCapMultiplier: 0.85
  wowClipMin: -0.50
  wowClipMax: 1.50

seasonality:
  minHistoricalWeeksRequired: 44
  minWindowCoverageRatio: 0.85
  peakProminenceMultiplier: 1.35
  targetPeakLeadWeeksMin: 8
  targetPeakLeadWeeksMax: 14

sellerContextNotice:
  nativeWindowDays: 7
  nativeBatchPages: 199
  nativeBatchRows: 9949
  selfBuiltAccumulatedDays: 7
  selfBuiltTargetDays: 28
  promoAutoDecision: false

